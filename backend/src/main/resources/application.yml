# ============================================================
# 职业能力大数据服务平台 - 后端配置
# ============================================================

server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 2048
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  application:
    name: careerPlatform-backend
  config:
    import:
      - optional:classpath:application-local.yml
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  # ─── 数据源 ─────────────────────────────
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:career_platform}?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 30000
      connection-init-sql: SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

  # ─── Redis (Spring Boot 2.x 路径) ──────
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5

  # ─── Jackson ────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

# ─── MyBatis-Plus ──────────────────────────
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ─── Swagger / OpenAPI ─────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /doc.html
    tags-sorter: alpha
    operations-sorter: alpha

# ─── 自定义配置 ─────────────────────────────
career:
  jwt:
    secret: ${JWT_SECRET:careerPlatform-jwt-secret-2026-do-change-in-production}
    access-token-expire: 7200      # 2小时 (秒)
    refresh-token-expire: 604800   # 7天 (秒)

  algorithm:
    service-url: ${ALGORITHM_SERVICE_URL:http://localhost:8000}
    timeout: 30000

  crawl:
    scheduler-url: ${CRAWL_SCHEDULER_URL:http://localhost:8001/api}

  ai:
    provider: ${AI_PROVIDER:siliconflow}
    api-key: ${AI_API_KEY:}
    api-url: ${AI_API_URL:https://api.siliconflow.cn/v1/chat/completions}
    model: ${AI_MODEL:deepseek-ai/DeepSeek-R1-Distill-Qwen-7B}
    max-tokens: 2000
    daily-quota: ${AI_DAILY_QUOTA:500}  # 每用户每天最大调用次数

  mail:
    enabled: ${CAREER_MAIL_ENABLED:false}
    from: ${MAIL_FROM:${spring.mail.username:}}

  cors:
    allowed-origins: "*"

# ─── Thymeleaf（仅用于PDF报告模板，非MVC视图）───
spring.thymeleaf:
  enabled: true
  cache: false
  prefix: classpath:/templates/
  suffix: .html
  mode: HTML

# ─── 文件上传 ─────────────────────────────────
spring.servlet:
  multipart:
    max-file-size: 10MB
    max-request-size: 10MB

# ─── 邮件（可选，默认关闭）─────────────────────
spring.mail:
  host: ${MAIL_HOST:smtp.example.com}
  port: ${MAIL_PORT:587}
  username: ${MAIL_USERNAME:}
  password: ${MAIL_PASSWORD:}
  properties:
    mail.smtp.auth: true
    mail.smtp.starttls.enable: true

# ─── 日志 ──────────────────────────────────
logging:
  level:
    com.career.platform: debug
    com.baomidou.mybatisplus: info
  file:
    name: logs/careerPlatform.log
