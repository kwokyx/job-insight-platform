    <!-- Material Symbols Outlined — used for the top-nav icons so that the
         selected item gets a native FILL 0 → FILL 1 "ink-in" transition
         via font-variation-settings. `display=swap` prevents the font from
         blocking first paint; a small flash of the literal icon name may
         appear for ~300ms on cold load. Ping a few Chinese mirrors (loli /
         font.im / geekzu) if this CDN is ever slow in your environment. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
    />
  </head>
