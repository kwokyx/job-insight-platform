# ============================================================
# 职业能力大数据服务平台 - 全面容器化部署 (带公网穿透)
# 启动: docker compose --profile full up -d --build
# 停止: docker compose --profile full down
# 测试内网穿透: docker compose logs -f tunnel
# ============================================================

services:
  # ─── 数据库与缓存中间件 ───────────────────
  mysql:
    image: mysql:8.0
    container_name: career-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-career2026}
      MYSQL_DATABASE: career_platform
      MYSQL_USER: career
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./config/schema_alignment_post_init.sql:/docker-entrypoint-initdb.d/02-schema-alignment.sql:ro
      - ./config/rebuild_dim_region_hierarchy.sql:/docker-entrypoint-initdb.d/03-region-hierarchy.sql:ro
      - ./config/seed_dim_major_and_match_rules.sql:/docker-entrypoint-initdb.d/04-major-match-rules.sql:ro
      - ./config/seed_dim_industry_and_backfill.sql:/docker-entrypoint-initdb.d/05-industry-backfill.sql:ro
      - ./config/seed_runtime_business_tables.sql:/docker-entrypoint-initdb.d/06-runtime-business.sql:ro
      - ./config/open_api_tables.sql:/docker-entrypoint-initdb.d/07-open-api-tables.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --max-connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: career-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: career-rabbitmq
    restart: unless-stopped
    profiles: ["acquisition"]
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 8

  # ─── Python 算法层 ──────────────────────
  algorithm:
    build:
      context: ./algorithm
      dockerfile: Dockerfile
    container_name: career-algorithm
    restart: unless-stopped
    ports:
      - "${ALGORITHM_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: career_platform
      MYSQL_USERNAME: career
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379

  # ─── Java 后端层 (自含 JDK 17) ───────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: career-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/career_platform?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&characterSetResults=utf8&sessionVariables=character_set_client=utf8mb4,character_set_connection=utf8mb4,character_set_results=utf8mb4&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: career
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-career2026}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: career_platform
      MYSQL_USERNAME: career
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ALGORITHM_SERVICE_URL: http://algorithm:8000
      CRAWL_SCHEDULER_URL: http://scheduler-center:8000/api
      AI_PROVIDER: ${AI_PROVIDER:-siliconflow}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_URL: ${AI_API_URL:-https://api.siliconflow.cn/v1/chat/completions}
      AI_MODEL: ${AI_MODEL:-deepseek-ai/DeepSeek-R1-0528-Qwen3-8B}
      JWT_SECRET: ${JWT_SECRET:-careerPlatform-jwt-secret-2026-change-in-production}
      CAREER_MAIL_ENABLED: ${CAREER_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      CRAWL_AUTOMATION_HOME: /workspace/tmp/automation
    volumes:
      - ./tmp/automation:/workspace/tmp/automation

  scheduler-center:
    build:
      context: ./integrations/distributed-data-acquisition/scheduler-center
      dockerfile: Dockerfile
    container_name: career-scheduler-center
    restart: unless-stopped
    profiles: ["acquisition"]
    ports:
      - "${SCHEDULER_CENTER_PORT:-8001}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DEBUG: "true"
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: mysql+pymysql://career:${MYSQL_PASSWORD:-career2026}@mysql:3306/career_platform?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      JOB_DATA_TABLE: ${CRAWL_JOB_TABLE:-crawl_job_posting}
      SCHEDULE_SCAN_INTERVAL_SECONDS: ${SCHEDULE_SCAN_INTERVAL_SECONDS:-10}
      SECRET_KEY: ${JWT_SECRET:-careerPlatform-jwt-secret-2026-change-in-production}
      HDFS_ENABLED: ${HDFS_ENABLED:-false}
      HDFS_HOST: ${HDFS_HOST:-hadoop001}
      HDFS_PORT: ${HDFS_PORT:-8020}
      HDFS_WEB_PORT: ${HDFS_WEB_PORT:-9870}
      HDFS_USER: ${HDFS_USER:-hadoop}
      HDFS_BASE_PATH: ${HDFS_BASE_PATH:-/data/recruitment_crawler/ods/job_detail}
      HDFS_CHANNEL: ${HDFS_CHANNEL:-zhaopin}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/monitor/dashboard', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 10s
      retries: 5
    volumes:
      - ./integrations/distributed-data-acquisition/scheduler-center/logs:/app/logs

  crawler-node:
    build:
      context: ./integrations/distributed-data-acquisition/crawler-node
      dockerfile: Dockerfile
    container_name: career-crawler-node
    restart: unless-stopped
    profiles: ["acquisition"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      scheduler-center:
        condition: service_healthy
    environment:
      SCHEDULER_HOST: scheduler-center
      SCHEDULER_PORT: 8000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-admin123}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: career
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-career2026}
      MYSQL_DATABASE: career_platform
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAX_CONCURRENT_TASKS: ${CRAWLER_MAX_CONCURRENT_TASKS:-3}
      NODE_NAME: ${CRAWLER_NODE_NAME:-docker-crawler-node}
      LOG_LEVEL: ${CRAWLER_LOG_LEVEL:-INFO}
    volumes:
      - ./integrations/distributed-data-acquisition/crawler-node/logs:/app/logs

  # ─── Vue 3 前端层 + Nginx ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: career-frontend
    restart: unless-stopped
    ports:
      - "80:80"        # 本地可直接访问 http://localhost
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro

  # ─── Cloudflare Tunnel 公网外挂穿透 ──────
  # 通过 Quick Tunnel 免费获取一个 https 公网域名指向前端 Nginx
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: career-tunnel
    restart: unless-stopped
    command: tunnel --url http://frontend:80
    depends_on:
      - frontend

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
